<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <template id="serverInstance">
        <button class="instanceButton"></button>
    </template>

    <template id="newServerMenu">
        <input id="name">
        <input id="version">
        <input id="type">
        <input id="gamemode">
        <input id="seed">
        <input id="difficulty">
    </template>

    <div class="mainContainer">
        <div class="sideMenu">
            <h1>QRYSTAL</h1>
            <button id="addServer">Add Server</button>
        </div>
        <div class="mainMenu">
            <div class="serverContainer">
                <h2>Server Name: <br></h2>
                <h2>Server Version: <br></h2>
                <h2>Server Status: <br></h2>
                <button class="startServer">Start</button>
                <button class="serverOptions">Options</button>
                <button class="serverFolder">Open Main Folder</button>
            </div>

            <div class="consoleMenu">
                <p class="serverConsole">Console Output Here.</p>
                <input class="inputCommand">
            </div>
        </div>

        </div>
    <script>
        const template = document.getElementById("serverInstance");
        const sideMenu = document.querySelector(".sideMenu");
        const addServer = document.getElementById("addServer");
        let i = 0;

        function createServerInstance() {
            console.log("Creating server...");
            i++;
            const clone = template.content.cloneNode(true);
            clone.querySelector("button").textContent = String(i);
            sideMenu.appendChild(clone);
        }

        addServer.addEventListener("click", createServerInstance);
    </script>
    </body>
</html>
